<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#202225">
  <title>Cholobots</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: #d7d9dd;
      color: #202124;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .messenger {
      width: min(820px, calc(100% - 32px));
      height: min(720px, calc(100vh - 32px));
      background: #f7f7f5;
      border: 2px solid #202124;
      box-shadow: 8px 8px 0 #202124;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* HEADER */

    .topbar {
      min-height: 72px;
      padding: 12px 18px;
      background: #ece9df;
      border-bottom: 2px solid #202124;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border: 2px solid #202124;
      background: #ffd94a;
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 900;
    }

    .identity-text strong {
      display: block;
      font-size: 15px;
      letter-spacing: .08em;
    }

    .status {
      margin-top: 4px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .online-dot {
      width: 9px;
      height: 9px;
      background: #3ba55c;
      border-radius: 50%;
      display: inline-block;
    }

    .brand {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .12em;
      opacity: .55;
    }

    /* CHAT */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 28px 22px;
      scroll-behavior: smooth;
    }

    .system-message {
      text-align: center;
      font-size: 11px;
      letter-spacing: .08em;
      opacity: .5;
      margin-bottom: 28px;
    }

    .message {
      display: flex;
      gap: 12px;
      margin-bottom: 26px;
      animation: appear .22s ease-out;
    }

    .message.you {
      flex-direction: row-reverse;
    }

    .mini-avatar {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      border: 2px solid #202124;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 900;
    }

    .cholo-avatar {
      background: #ffd94a;
    }

    .you-avatar {
      background: #ffffff;
    }

    .message-body {
      max-width: 72%;
    }

    .you .message-body {
      text-align: right;
    }

    .meta {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      margin-bottom: 6px;
    }

    .time {
      font-weight: normal;
      opacity: .45;
      margin-left: 6px;
      letter-spacing: 0;
    }

    .bubble {
      display: inline-block;
      text-align: left;
      background: white;
      border: 2px solid #202124;
      padding: 12px 14px;
      line-height: 1.45;
      font-size: 16px;
      box-shadow: 3px 3px 0 rgba(32,33,36,.18);
    }

    .you .bubble {
      background: #dfe7ff;
    }

    /* TYPING */

    .typing {
      display: none;
      align-items: center;
      gap: 8px;
      margin: -10px 0 24px 48px;
      font-size: 12px;
      opacity: .6;
      font-style: italic;
    }

    .typing.visible {
      display: flex;
    }

    .dots span {
      display: inline-block;
      animation: blink 1.1s infinite;
    }

    .dots span:nth-child(2) {
      animation-delay: .15s;
    }

    .dots span:nth-child(3) {
      animation-delay: .3s;
    }

    /* INPUT */

    .composer {
      padding: 14px;
      border-top: 2px solid #202124;
      background: #ece9df;
    }

    .input-wrap {
      display: flex;
      border: 2px solid #202124;
      background: white;
    }

    input {
      flex: 1;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 15px;
      font-size: 16px;
      background: transparent;
    }

    button {
      width: 58px;
      border: 0;
      border-left: 2px solid #202124;
      background: #ffd94a;
      color: #202124;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(.96);
    }

    button:disabled {
      cursor: default;
      opacity: .45;
    }

    .composer-note {
      margin-top: 7px;
      font-size: 10px;
      opacity: .45;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes blink {
      0%, 60%, 100% { opacity: .25; }
      30% { opacity: 1; }
    }

    /* PHONE */

    @media (max-width: 600px) {
      body {
        background: #f7f7f5;
      }

      .messenger {
        width: 100%;
        height: 100dvh;
        border: 0;
        box-shadow: none;
      }

      .topbar {
        min-height: 66px;
      }

      .brand {
        display: none;
      }

      .chat {
        padding: 22px 14px;
      }

      .message-body {
        max-width: 82%;
      }

      .bubble {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <main class="messenger">

    <header class="topbar">
      <div class="identity">
        <div class="avatar">C</div>

        <div class="identity-text">
          <strong>CHOLO</strong>

          <div class="status">
            <span class="online-dot"></span>
            online
          </div>
        </div>
      </div>

      <div class="brand">
        CHOLOBOTS
      </div>
    </header>

    <section class="chat" id="chat">

      <div class="system-message">
        You started a conversation with Cholo.
      </div>

      <div class="message">
        <div class="mini-avatar cholo-avatar">C</div>

        <div class="message-body">
          <div class="meta">
            CHOLO
            <span class="time" id="openingTime"></span>
          </div>

          <div class="bubble">
            <strong>¿Qué onda?</strong><br>
            What brings you here today?
          </div>
        </div>
      </div>

      <div class="typing" id="typing">
        Cholo is typing
        <span class="dots">
          <span>●</span>
          <span>●</span>
          <span>●</span>
        </span>
      </div>

    </section>

    <footer class="composer">
      <div class="input-wrap">
        <input
          id="visitorAnswer"
          type="text"
          placeholder="Message Cholo..."
          autocomplete="off"
          maxlength="500"
          autofocus
        >

        <button id="sendButton" aria-label="Send message">
          ➤
        </button>
      </div>

      <div class="composer-note">
        cholobot.com
      </div>
    </footer>

  </main>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("visitorAnswer");
    const sendButton = document.getElementById("sendButton");
    const typing = document.getElementById("typing");
    const openingTime = document.getElementById("openingTime");

    let introComplete = false;

    function currentTime() {
      return new Intl.DateTimeFormat([], {
        hour: "numeric",
        minute: "2-digit"
      }).format(new Date());
    }

    openingTime.textContent = currentTime();

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function addVisitorMessage(text) {
      const message = document.createElement("div");
      message.className = "message you";

      message.innerHTML = `
        <div class="mini-avatar you-avatar">Y</div>

        <div class="message-body">
          <div class="meta">
            YOU
            <span class="time">${currentTime()}</span>
          </div>

          <div class="bubble"></div>
        </div>
      `;

      message.querySelector(".bubble").textContent = text;

      chat.insertBefore(message, typing);
      scrollToBottom();
    }

    function addCholoMessage(html) {
      const message = document.createElement("div");
      message.className = "message";

      message.innerHTML = `
        <div class="mini-avatar cholo-avatar">C</div>

        <div class="message-body">
          <div class="meta">
            CHOLO
            <span class="time">${currentTime()}</span>
          </div>

          <div class="bubble">${html}</div>
        </div>
      `;

      chat.insertBefore(message, typing);
      scrollToBottom();
    }

    function showTyping() {
      typing.classList.add("visible");
      scrollToBottom();
    }

    function hideTyping() {
      typing.classList.remove("visible");
    }

    function sendMessage() {
      const text = input.value.trim();

      if (!text) return;

      addVisitorMessage(text);

      input.value = "";
      input.disabled = true;
      sendButton.disabled = true;

      showTyping();

      setTimeout(() => {
        hideTyping();

        if (!introComplete) {
          addCholoMessage(
            "<strong>¡Órale!</strong><br><br>" +
            "Pues let me show you what us Cholobots do."
          );

          introComplete = true;

          input.placeholder = "Message Cholo...";
        }

        input.disabled = false;
        sendButton.disabled = false;
        input.focus();

      }, 1100);
    }

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
