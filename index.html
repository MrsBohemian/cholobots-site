<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cholobots</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #f5f0e8;
      color: #171717;
      font-family: Arial, sans-serif;
    }

    .cholo {
      width: 100%;
      max-width: 600px;
    }

    .name {
      font-size: 0.8rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(2.8rem, 10vw, 5rem);
      line-height: 0.95;
      margin: 0 0 18px;
    }

    .question {
      font-size: 1.4rem;
      line-height: 1.4;
      margin-bottom: 32px;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 16px;
      border: 2px solid #171717;
      background: transparent;
      font-size: 1rem;
    }

    button {
      padding: 16px 20px;
      border: 2px solid #171717;
      background: #171717;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    #response {
      display: none;
      margin-top: 36px;
      font-size: 1.5rem;
      line-height: 1.4;
    }
  </style>
</head>

<body>

  <main class="cholo">

    <div class="name">CHOLO</div>

    <h1>¿Qué onda?</h1>

    <div class="question">
      What brings you here today?
    </div>

    <div class="input-row" id="inputArea">
      <input
        id="visitorAnswer"
        type="text"
        placeholder="Tell me..."
        autocomplete="off"
      >
      <button id="submitAnswer">→</button>
    </div>

    <div id="response">
      <strong>¡Órale!</strong><br><br>
      Pues let me show you what us Cholobots do.
    </div>

  </main>

  <script>
    const input = document.getElementById("visitorAnswer");
    const button = document.getElementById("submitAnswer");
    const inputArea = document.getElementById("inputArea");
    const response = document.getElementById("response");

    function answerCholo() {
      const answer = input.value.trim();

      if (!answer) return;

      inputArea.style.display = "none";
      response.style.display = "block";

      console.log("Visitor said:", answer);
    }

    button.addEventListener("click", answerCholo);

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        answerCholo();
      }
    });
  </script>

</body>
</html>
