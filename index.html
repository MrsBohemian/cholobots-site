<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">

<title>Cholobots</title>

<style>
  * { box-sizing: border-box; }

  :root {
    --black: #050505;
    --panel: #17171a;
    --panel2: #202024;
    --text: #f1f1f2;
    --muted: #96969d;
    --yellow: #ffc21c;
    --green: #23a55a;
  }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--black);
    color: var(--text);
    font-family: Inter, Arial, Helvetica, sans-serif;
  }

  /* ---------------- WELCOME ---------------- */

  #welcome {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;

    transition: opacity .3s ease;
  }

  .welcome-inner {
    text-align: center;
    position: relative;
    z-index: 2;
  }

  #cholo {
    width: min(480px, 72vw);
    max-height: 65vh;
    object-fit: contain;

    cursor: pointer;

    filter:
      drop-shadow(0 0 8px rgba(255,194,28,.18))
      drop-shadow(0 0 24px rgba(255,194,28,.08));

    animation: breathe 2.8s ease-in-out infinite;

    transition:
      transform .5s cubic-bezier(.2,.8,.2,1),
      filter .35s ease;
  }

  #cholo:hover {
    transform: scale(1.035);

    filter:
      drop-shadow(0 0 10px rgba(255,194,28,.65))
      drop-shadow(0 0 34px rgba(255,194,28,.28));
  }

  .welcome-copy {
    margin-top: 8px;
    transition: opacity .18s ease;
  }

  .welcome-copy h1 {
    margin: 0;
    color: white;
    font-size: clamp(28px, 5vw, 52px);
    letter-spacing: .06em;
  }

  .welcome-copy p {
    margin: 9px 0 0;
    color: var(--yellow);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: .18em;
    text-transform: uppercase;

    animation: blinkPrompt 1.7s ease-in-out infinite;
  }

  #welcome.activating .welcome-copy {
    opacity: 0;
  }

  #welcome.activating #cholo {
    animation: none;

    transform: scale(1.7);

    filter:
      brightness(1.25)
      drop-shadow(0 0 18px rgba(255,194,28,1))
      drop-shadow(0 0 60px rgba(255,194,28,.85))
      drop-shadow(0 0 130px rgba(255,194,28,.45));
  }

  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.018); }
  }

  @keyframes blinkPrompt {
    0%,100% { opacity: .55; }
    50% { opacity: 1; }
  }


  /* ---------------- PIXELS ---------------- */

  #pixelCanvas {
    position: fixed;
    inset: 0;
    z-index: 30;

    width: 100%;
    height: 100%;

    pointer-events: none;

    opacity: 0;
  }


  /* ---------------- CHAT REVEAL ---------------- */

  #experience {
    position: fixed;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 24px;

    background:
      radial-gradient(
        circle at center,
        #141417 0%,
        #080809 55%,
        #000 100%
      );

    opacity: 0;
    transform: scale(.96);

    transition:
      opacity .5s ease,
      transform .5s ease;
  }

  #experience.visible {
    opacity: 1;
    transform: scale(1);
  }

  .dialog {
    width: min(580px, 100%);

    background: var(--panel);

    border: 1px solid #34343a;
    border-radius: 14px;

    box-shadow:
      0 30px 100px rgba(0,0,0,.75),
      0 0 45px rgba(255,194,28,.04);

    overflow: hidden;
  }

  .dialog-header {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 15px 18px;

    background: #111113;

    border-bottom: 1px solid #303035;
  }

  .dialog-avatar {
    width: 42px;
    height: 42px;

    border-radius: 50%;

    object-fit: cover;

    background: black;

    border: 1px solid #39393e;
  }

  .dialog-name {
    font-size: 14px;
    font-weight: 800;
    letter-spacing: .05em;
  }

  .dialog-status {
    display: flex;
    align-items: center;
    gap: 6px;

    margin-top: 4px;

    color: var(--muted);
    font-size: 11px;
  }

  .status-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;
    background: var(--green);
  }

  .conversation {
    padding: 32px 26px 28px;
  }

  .message {
    display: flex;
    gap: 13px;
  }

  .message-avatar {
    width: 42px;
    height: 42px;

    flex: 0 0 42px;

    border-radius: 50%;
    object-fit: cover;

    background: black;
  }

  .message-body {
    flex: 1;
  }

  .message-meta {
    margin-bottom: 6px;
  }

  .message-name {
    color: var(--yellow);

    font-size: 13px;
    font-weight: 800;
  }

  .message-text {
    color: #dedee1;

    font-size: 18px;
    line-height: 1.55;
  }

  .message-text strong {
    color: white;
  }

  .composer {
    display: flex;

    margin-top: 28px;

    background: var(--panel2);

    border: 1px solid #37373d;
    border-radius: 9px;

    overflow: hidden;
  }

  #visitorAnswer {
    flex: 1;
    min-width: 0;

    border: 0;
    outline: 0;

    padding: 16px;

    background: transparent;
    color: white;

    font: inherit;
    font-size: 16px;
  }

  #visitorAnswer::placeholder {
    color: #72727a;
  }

  #sendButton {
    width: 58px;

    border: 0;

    background: transparent;
    color: var(--yellow);

    font-size: 22px;

    cursor: pointer;
  }

  #sendButton:hover {
    background: rgba(255,255,255,.04);
  }


  /* ---------------- MOBILE ---------------- */

  @media (max-width: 600px) {

    #cholo {
      width: 82vw;
    }

    #experience {
      padding: 14px;
    }

    .conversation {
      padding: 26px 18px 22px;
    }

    .message-text {
      font-size: 16px;
    }

  }

</style>
</head>


<body>

<!-- CHAT IS ALREADY UNDER THE CURTAIN -->

<section id="experience">

  <div class="dialog">

    <header class="dialog-header">

      <img
        src="icon.png"
        class="dialog-avatar"
        alt="Cholo"
      >

      <div>

        <div class="dialog-name">
          CHOLO
        </div>

        <div class="dialog-status">
          <span class="status-dot"></span>
          Online
        </div>

      </div>

    </header>


    <div class="conversation">

      <div class="message">

        <img
          src="icon.png"
          class="message-avatar"
          alt=""
        >

        <div class="message-body">

          <div class="message-meta">
            <span class="message-name">
              CHOLO
            </span>
          </div>

          <div class="message-text">

            <strong>¿Qué onda?</strong><br>

            What brings you here today?

          </div>

        </div>

      </div>


      <div class="composer">

        <input
          id="visitorAnswer"
          type="text"
          placeholder="Message Cholo..."
          autocomplete="off"
        >

        <button
          id="sendButton"
          aria-label="Send"
        >
          ➤
        </button>

      </div>

    </div>

  </div>

</section>


<!-- WELCOME CURTAIN -->

<section id="welcome">

  <div class="welcome-inner">

    <img
      src="icon.png"
      id="cholo"
      alt="Cholo"
    >

    <div class="welcome-copy">

      <h1>
        ¿QUÉ ONDA?
      </h1>

      <p>
        Click the Cholo
      </p>

    </div>

  </div>

</section>


<!-- PIXEL EFFECT -->

<canvas id="pixelCanvas"></canvas>


<script>

const welcome =
  document.getElementById("welcome");

const cholo =
  document.getElementById("cholo");

const canvas =
  document.getElementById("pixelCanvas");

const ctx =
  canvas.getContext("2d");

const experience =
  document.getElementById("experience");

const input =
  document.getElementById("visitorAnswer");


let running = false;


function sizeCanvas() {

  const dpr =
    window.devicePixelRatio || 1;

  canvas.width =
    window.innerWidth * dpr;

  canvas.height =
    window.innerHeight * dpr;

  canvas.style.width =
    window.innerWidth + "px";

  canvas.style.height =
    window.innerHeight + "px";

  ctx.setTransform(
    dpr, 0,
    0, dpr,
    0, 0
  );

}


sizeCanvas();

window.addEventListener(
  "resize",
  sizeCanvas
);


/* CREATE PIXEL PARTICLES FROM THE IMAGE */

function createParticles() {

  const rect =
    cholo.getBoundingClientRect();

  const temp =
    document.createElement("canvas");

  const tempCtx =
    temp.getContext("2d");

  const sampleWidth = 180;

  const ratio =
    cholo.naturalHeight /
    cholo.naturalWidth;

  temp.width =
    sampleWidth;

  temp.height =
    Math.round(
      sampleWidth * ratio
    );


  tempCtx.drawImage(
    cholo,
    0,
    0,
    temp.width,
    temp.height
  );


  const data =
    tempCtx.getImageData(
      0,
      0,
      temp.width,
      temp.height
    );


  const particles = [];

  const step = 3;


  for (
    let y = 0;
    y < temp.height;
    y += step
  ) {

    for (
      let x = 0;
      x < temp.width;
      x += step
    ) {

      const index =
        (y * temp.width + x) * 4;

      const alpha =
        data.data[index + 3];


      if (alpha < 40) {
        continue;
      }


      const r =
        data.data[index];

      const g =
        data.data[index + 1];

      const b =
        data.data[index + 2];


      particles.push({

        x:
          rect.left +
          (x / temp.width) *
          rect.width,

        y:
          rect.top +
          (y / temp.height) *
          rect.height,

        size:
          Math.max(
            3,
            rect.width /
            temp.width *
            step
          ),

        r,
        g,
        b,

        alpha:
          alpha / 255,

        vx:
          (Math.random() - .5) *
          8,

        vy:
          (Math.random() - .5) *
          6,

        rotation:
          Math.random() *
          Math.PI,

        vr:
          (Math.random() - .5) *
          .12

      });

    }

  }


  return particles;

}


/* RUN THE DISSOLVE */

function dissolve() {

  const particles =
    createParticles();

  canvas.style.opacity = "1";

  cholo.style.opacity = "0";


  let start = null;

  const duration = 850;


  function frame(timestamp) {

    if (!start) {
      start = timestamp;
    }


    const elapsed =
      timestamp - start;

    const progress =
      Math.min(
        elapsed / duration,
        1
      );


    ctx.clearRect(
      0,
      0,
      window.innerWidth,
      window.innerHeight
    );


    particles.forEach(
      particle => {

        const spread =
          progress * progress;


        particle.x +=
          particle.vx *
          (1 + spread * 2);

        particle.y +=
          particle.vy *
          (1 + spread * 1.5);

        particle.rotation +=
          particle.vr;


        const fade =
          1 - progress;


        ctx.save();

        ctx.globalAlpha =
          particle.alpha * fade;

        ctx.translate(
          particle.x,
          particle.y
        );

        ctx.rotate(
          particle.rotation
        );

        ctx.fillStyle =
          `rgb(
            ${particle.r},
            ${particle.g},
            ${particle.b}
          )`;


        ctx.fillRect(
          -particle.size / 2,
          -particle.size / 2,
          particle.size,
          particle.size
        );

        ctx.restore();

      }
    );


    if (progress < 1) {

      requestAnimationFrame(
        frame
      );

    }

    else {

      canvas.style.opacity =
        "0";

      welcome.style.display =
        "none";

      input.focus();

    }

  }


  requestAnimationFrame(
    frame
  );

}


/* CLICK CHOLO */

cholo.addEventListener(
  "click",
  function() {

    if (running) {
      return;
    }

    running = true;


    welcome.classList.add(
      "activating"
    );


    /* Reveal the dialog underneath */

    setTimeout(
      () => {

        experience.classList.add(
          "visible"
        );

      },
      300
    );


    /* Then break Cholo apart */

    setTimeout(
      dissolve,
      520
    );

  }
);

</script>

</body>
</html>
