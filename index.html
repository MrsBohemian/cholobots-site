<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d0f">

  <title>Cholobots</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --black: #0d0d0f;
      --panel: #151518;
      --panel-light: #1c1c20;
      --input: #232328;

      --text: #f2f2f3;
      --muted: #98989f;
      --faint: #68686f;

      --accent: #f2c94c;
      --green: #23a55a;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      background: var(--black);
      color: var(--text);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      min-height: 100dvh;

      background: var(--panel);

      display: flex;
      flex-direction: column;

      border-left: 1px solid #242429;
      border-right: 1px solid #242429;
    }

    /* HEADER */

    .header {
      height: 72px;
      flex: 0 0 72px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 24px;

      background: #111113;
      border-bottom: 1px solid #29292e;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;

      border-radius: 50%;

      background: var(--accent);
      color: #111;

      display: grid;
      place-items: center;

      font-size: 18px;
      font-weight: 900;
    }

    .identity-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .username {
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .06em;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;

      color: var(--muted);
      font-size: 12px;
    }

    .online {
      width: 8px;
      height: 8px;

      background: var(--green);
      border-radius: 50%;
    }

    .brand {
      color: var(--faint);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .16em;
    }

    /* CHAT */

    .chat {
      flex: 1;
      overflow-y: auto;

      padding: 30px 0 50px;
      scroll-behavior: smooth;
    }

    .system {
      color: var(--faint);

      font-size: 12px;
      text-align: center;

      margin: 6px 20px 36px;
    }

    .message {
      display: flex;
      gap: 16px;

      padding: 10px 28px;

      animation: messageIn .2s ease-out;
    }

    .message:hover {
      background: rgba(255,255,255,.018);
    }

    .message-avatar {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;

      border-radius: 50%;

      display: grid;
      place-items: center;

      font-weight: 900;
    }

    .cholo-avatar {
      background: var(--accent);
      color: #111;
    }

    .you-avatar {
      background: #34343b;
      color: #ddd;
    }

    .message-content {
      flex: 1;
      min-width: 0;
    }

    .message-meta {
      display: flex;
      align-items: baseline;
      gap: 8px;

      margin-bottom: 5px;
    }

    .message-name {
      font-size: 14px;
      font-weight: 800;
    }

    .cholo-name {
      color: var(--accent);
    }

    .message-time {
      color: var(--faint);
      font-size: 11px;
    }

    .message-text {
      color: #dedee1;

      font-size: 16px;
      line-height: 1.5;

      max-width: 760px;

      white-space: normal;
      overflow-wrap: anywhere;
    }

    .message-text strong {
      color: #fff;
    }

    /* TYPING */

    .typing {
      display: none;

      align-items: center;
      gap: 8px;

      margin-left: 86px;
      padding: 6px 0 10px;

      color: var(--muted);

      font-size: 12px;
      font-style: italic;
    }

    .typing.visible {
      display: flex;
    }

    .typing-dots span {
      display: inline-block;
      animation: typing 1.1s infinite;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: .30s;
    }

    /* COMPOSER */

    .composer-area {
      flex: 0 0 auto;

      padding: 0 24px 22px;

      background:
        linear-gradient(
          to bottom,
          rgba(21,21,24,0),
          var(--panel) 24px
        );
    }

    .composer {
      display: flex;
      align-items: center;

      background: var(--input);

      border: 1px solid #303036;
      border-radius: 9px;

      overflow: hidden;
    }

    input {
      flex: 1;
      min-width: 0;

      padding: 16px 18px;

      border: 0;
      outline: 0;

      background: transparent;
      color: white;

      font-family: inherit;
      font-size: 16px;
    }

    input::placeholder {
      color: #777780;
    }

    button {
      width: 58px;
      height: 52px;

      border: 0;

      background: transparent;
      color: var(--accent);

      font-size: 21px;

      cursor: pointer;
    }

    button:hover {
      background: rgba(255,255,255,.04);
    }

    button:disabled {
      opacity: .35;
      cursor: default;
    }

    .domain {
      margin-top: 8px;

      color: #4f4f56;

      font-size: 10px;
      text-align: right;

      letter-spacing: .08em;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes typing {
      0%, 60%, 100% {
        opacity: .2;
      }

      30% {
        opacity: 1;
      }
    }

    /* MOBILE */

    @media (max-width: 650px) {

      .app {
        border: 0;
      }

      .header {
        height: 64px;
        flex-basis: 64px;

        padding: 0 16px;
      }

      .avatar {
        width: 38px;
        height: 38px;
      }

      .brand {
        font-size: 10px;
      }

      .chat {
        padding-top: 22px;
      }

      .message {
        padding: 10px 16px;
        gap: 12px;
      }

      .message-avatar {
        width: 38px;
        height: 38px;
        flex-basis: 38px;
      }

      .message-text {
        font-size: 15px;
      }

      .typing {
        margin-left: 66px;
      }

      .composer-area {
        padding: 0 12px 12px;
      }

      .domain {
        display: none;
      }
    }

  </style>
</head>

<body>

  <main class="app">

    <!-- HEADER -->

    <header class="header">

      <div class="identity">

        <div class="avatar">
          C
        </div>

        <div class="identity-info">

          <div class="username">
            CHOLO
          </div>

          <div class="status">
            <span class="online"></span>
            Online
          </div>

        </div>

      </div>

      <div class="brand">
        CHOLOBOTS
      </div>

    </header>


    <!-- CHAT -->

    <section
      class="chat"
      id="chat"
      aria-live="polite"
    >

      <div class="system">
        You started a conversation with Cholo.
      </div>


      <!-- OPENING MESSAGE -->

      <div class="message">

        <div class="message-avatar cholo-avatar">
          C
        </div>

        <div class="message-content">

          <div class="message-meta">

            <span class="message-name cholo-name">
              CHOLO
            </span>

            <span
              class="message-time"
              id="openingTime"
            ></span>

          </div>

          <div class="message-text">
            <strong>¿Qué onda?</strong><br>
            What brings you here today?
          </div>

        </div>

      </div>


      <!-- TYPING -->

      <div
        class="typing"
        id="typing"
      >

        <span>
          Cholo is typing
        </span>

        <span class="typing-dots">
          <span>●</span>
          <span>●</span>
          <span>●</span>
        </span>

      </div>

    </section>


    <!-- MESSAGE COMPOSER -->

    <footer class="composer-area">

      <div class="composer">

        <input
          id="visitorAnswer"
          type="text"
          placeholder="Message Cholo..."
          autocomplete="off"
          maxlength="500"
          autofocus
        >

        <button
          id="sendButton"
          aria-label="Send message"
        >
          ➤
        </button>

      </div>

      <div class="domain">
        cholobot.com
      </div>

    </footer>

  </main>


  <script>

    const chat =
      document.getElementById("chat");

    const input =
      document.getElementById("visitorAnswer");

    const sendButton =
      document.getElementById("sendButton");

    const typing =
      document.getElementById("typing");

    const openingTime =
      document.getElementById("openingTime");


    let introComplete = false;


    function currentTime() {

      return new Intl.DateTimeFormat(
        [],
        {
          hour: "numeric",
          minute: "2-digit"
        }
      ).format(new Date());

    }


    openingTime.textContent =
      "Today at " + currentTime();


    function scrollToBottom() {

      chat.scrollTop =
        chat.scrollHeight;

    }


    function addVisitorMessage(text) {

      const message =
        document.createElement("div");

      message.className =
        "message";


      const avatar =
        document.createElement("div");

      avatar.className =
        "message-avatar you-avatar";

      avatar.textContent =
        "Y";


      const content =
        document.createElement("div");

      content.className =
        "message-content";


      const meta =
        document.createElement("div");

      meta.className =
        "message-meta";


      const name =
        document.createElement("span");

      name.className =
        "message-name";

      name.textContent =
        "YOU";


      const time =
        document.createElement("span");

      time.className =
        "message-time";

      time.textContent =
        "Today at " + currentTime();


      const textElement =
        document.createElement("div");

      textElement.className =
        "message-text";

      textElement.textContent =
        text;


      meta.appendChild(name);
      meta.appendChild(time);

      content.appendChild(meta);
      content.appendChild(textElement);

      message.appendChild(avatar);
      message.appendChild(content);


      chat.insertBefore(
        message,
        typing
      );


      scrollToBottom();

    }


    function addCholoMessage(html) {

      const message =
        document.createElement("div");

      message.className =
        "message";


      message.innerHTML = `

        <div class="message-avatar cholo-avatar">
          C
        </div>

        <div class="message-content">

          <div class="message-meta">

            <span class="message-name cholo-name">
              CHOLO
            </span>

            <span class="message-time">
              Today at ${currentTime()}
            </span>

          </div>

          <div class="message-text">
            ${html}
          </div>

        </div>

      `;


      chat.insertBefore(
        message,
        typing
      );


      scrollToBottom();

    }


    function showTyping() {

      typing.classList.add(
        "visible"
      );

      scrollToBottom();

    }


    function hideTyping() {

      typing.classList.remove(
        "visible"
      );

    }


    function sendMessage() {

      const text =
        input.value.trim();


      if (!text) {
        return;
      }


      addVisitorMessage(text);


      input.value = "";

      input.disabled = true;
      sendButton.disabled = true;


      showTyping();


      setTimeout(() => {

        hideTyping();


        if (!introComplete) {

          addCholoMessage(
            "<strong>¡Órale!</strong><br>" +
            "Pues let me show you what us Cholobots do."
          );

          introComplete = true;

        }


        input.disabled = false;
        sendButton.disabled = false;

        input.focus();


      }, 1100);

    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      }
    );

  </script>

</body>
</html>
